name: Build Android APK

# Produces two artifacts on every run:
#   FloatBet-<version>-release.apk  signed, if the keystore secrets exist
#   FloatBet-<version>-debug.apk    always, installable on any device
#
# The APK embeds the web build, so it is NOT auto-updating. A new web deploy
# does not reach installed apps; rebuild and republish.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / AGP 8.13 target SDK 36, which needs JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      # versionCode must increase or Android rejects the upgrade. Derive it from
      # the commit count so it is monotonic without anyone remembering.
      - name: Resolve version
        id: v
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME=$(node -p "require('./package.json').version")
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME.$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME.$CODE versionCode=$CODE"

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FB_VERSION_CODE: ${{ steps.v.outputs.code }}
          FB_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        env:
          FB_VERSION_CODE: ${{ steps.v.outputs.code }}
          FB_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # A keystore that was decoded but is not the one the app was signed with
      # would produce an APK that fails to install over the previous version.
      # apksigner catches an unsigned or malformed artifact here instead of on a
      # user's phone.
      - name: Verify the APKs are signed
        run: |
          set -e
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk; do
            [ -f "$f" ] || continue
            echo "== $f"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$f" | head -4
          done

      - name: Upload release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FloatBet-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatBet-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
