name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Branch-based deployment: the build output is pushed to `gh-pages`, which does
# not require the Pages API (that needs an admin token). Once Pages is pointed at
# the `gh-pages` branch in Settings → Pages, every push to main redeploys.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # "/<repo>/" for project pages, "/" for user/org pages
          BASE_PATH: ${{ format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: 'Deploy ${{ github.sha }} to GitHub Pages'
          force_orphan: true
