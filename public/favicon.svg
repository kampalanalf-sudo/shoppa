<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="fbglow" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#c6f24e" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fbbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0d15"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fbbg)"/>
  <rect width="64" height="64" rx="15" fill="url(#fbglow)"/>
  <g transform="translate(4.2 6.6) scale(.58)">
  <defs>
    <linearGradient id="fv-frontg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#1f6f3f"/>
      <stop offset="0.55" stop-color="#11412a"/>
      <stop offset="1" stop-color="#11412a"/>
    </linearGradient>
    <linearGradient id="fv-topg" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#1f6f3f"/>
      <stop offset="0.6" stop-color="#3fbf5f"/>
      <stop offset="1" stop-color="#3fbf5f"/>
    </linearGradient>
    <linearGradient id="fv-rightg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a1b"/>
      <stop offset="1" stop-color="#0b2a1b" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="fv-pip" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f2ffe0"/>
      <stop offset="1" stop-color="#c9f7a8"/>
    </linearGradient>
    <!-- a soft drop shadow under the cube, so it sits on the surface -->
    <radialGradient id="fv-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- specular sheen across the lit top face -->
    <linearGradient id="fv-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="80" rx="30" ry="6" fill="url(#fv-shadow)"/>
  <g stroke="rgba(0,0,0,.55)" stroke-width="0.8" stroke-linejoin="round">
    <path d="M38.00 17.00 L80.00 17.00 L62.00 33.00 L20.00 33.00 Z" fill="url(#fv-topg)"/>
    <path d="M80.00 17.00 L80.00 59.00 L62.00 75.00 L62.00 33.00 Z" fill="url(#fv-rightg)"/>
    <path d="M20.00 33.00 L62.00 33.00 L62.00 75.00 L20.00 75.00 Z" fill="url(#fv-frontg)"/>
  </g>
  <!-- bevel: a lit inner edge on the front face and a dark one where it turns -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38.00 17.00 L80.00 17.00 L62.00 33.00 L20.00 33.00 Z" stroke="url(#fv-sheen)" stroke-width="1.6" fill="url(#fv-sheen)"/>
    <path d="M20 33 L62 33" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.1"/>
    <path d="M62 33 L62 75" stroke="#000" stroke-opacity=".45" stroke-width="1.2"/>
    <path d="M62 33 L80 59" stroke="#000" stroke-opacity=".3" stroke-width="0.9"/>
  </g>
  <!-- pips with a tiny inner highlight so they read as drilled, not painted -->
  <g><circle cx="44.24" cy="21.16" r="2.7" fill="url(#fv-pip)"/><circle cx="50.00" cy="25.00" r="2.7" fill="url(#fv-pip)"/><circle cx="55.76" cy="28.84" r="2.7" fill="url(#fv-pip)"/><circle cx="27.56" cy="40.56" r="4.5" fill="url(#fv-pip)"/><circle cx="54.44" cy="40.56" r="4.5" fill="url(#fv-pip)"/><circle cx="41.00" cy="54.00" r="4.5" fill="url(#fv-pip)"/><circle cx="27.56" cy="67.44" r="4.5" fill="url(#fv-pip)"/><circle cx="54.44" cy="67.44" r="4.5" fill="url(#fv-pip)"/></g>
</g>
</svg>